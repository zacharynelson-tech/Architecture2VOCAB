<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ArchCrossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --ink: #1C1E21; --sub: #6B7280; --line: #D8D5CC;
  --bg: #FAF9F6; --card: #FFFFFF;
  --accent: #2563EB; --accent-soft: #EFF4FF;
  --good: #15803D; --bad: #B91C1C;
  --cell-bg: #FFFFFF; --cell-block: transparent;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
    --bg: #121213; --card: #1E1E1F; --accent-soft: #1B2A4A;
    --cell-bg: #2A2A2C;
  }
}
:root[data-theme="dark"] {
  --ink: #EDEDED; --sub: #9AA0A6; --line: #3A3A3C;
  --bg: #121213; --card: #1E1E1F; --accent-soft: #1B2A4A;
  --cell-bg: #2A2A2C;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100%;
  padding: 16px 12px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; }
header { text-align: center; margin-bottom: 10px; }
h1 { font-size: 22px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
.sub { font-size: 13px; color: var(--sub); margin: 0 0 14px; }
.controls-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
#cycle-select {
  font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  max-width: 100%;
}
button.action {
  background: var(--accent); color: #fff; border: none; border-radius: 999px;
  font-size: 13px; font-weight: 700; padding: 8px 16px; cursor: pointer;
}
button.action.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
#message { text-align: center; font-size: 13.5px; font-weight: 700; color: var(--accent); min-height: 18px; margin-bottom: 10px; }
#grid-wrap { overflow-x: auto; display: flex; justify-content: center; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
#grid {
  display: grid; gap: 1px; background: var(--line); border: 2px solid var(--line);
}
.cell {
  position: relative; background: var(--cell-bg); width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.cell.block { background: transparent; }
.cell input {
  width: 100%; height: 100%; border: none; background: transparent; text-align: center;
  font-size: 15px; font-weight: 700; text-transform: uppercase; color: var(--ink);
  padding: 0; outline: none;
}
.cell .num { position: absolute; top: 1px; left: 2px; font-size: 8px; font-weight: 700; color: var(--sub); }
.cell.active { background: var(--accent-soft); }
.cell.correct input { color: var(--good); }
.cell.incorrect input { color: var(--bad); }
.clues { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.clue-col { flex: 1; min-width: 240px; max-width: 340px; }
.clue-col h3 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
.clue-item { font-size: 12.5px; margin-bottom: 7px; line-height: 1.35; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.clue-item.active { background: var(--accent-soft); }
.clue-item b { color: var(--ink); }
#result-panel {
  display: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; margin-top: 16px;
}
#result-panel.show { display: block; }
#result-panel h3 { font-size: 15px; margin: 0 0 10px; }
.reveal-item { font-size: 12.5px; margin-bottom: 6px; }
.reveal-item b { color: var(--accent); }
.back-link {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
  color: var(--sub); text-decoration: none; margin-bottom: 10px;
}
.back-link:hover { color: var(--accent); }
</style>

<body>

  ]},
  { num: 10, title: "Review & Portfolio", words: [
    {term:"portfolio", def:"A curated collection of a person's work used to showcase their skills."},
    {term:"workmanship", def:"The skill and quality demonstrated in the execution of a task."},
    {term:"competency", def:"A demonstrated ability to perform a specific skill or task."},

const TARGET_WORDS = 14;
const GRID_SIZE = 25;

function normalize(term) {
  return term.toLowerCase().replace(/[^a-z]/g, "");
}
function wordCountOf(term) {
  return term.split(/[\s\-\/]+/).length;
}
function displayOf(entry) {
  return entry.display || (entry.term.charAt(0).toUpperCase() + entry.term.slice(1));
}

function makeEmptyGrid() {
  const g = [];
  for (let r = 0; r < GRID_SIZE; r++) g.push(new Array(GRID_SIZE).fill(null));
  return g;
}

function canPlace(grid, word, row, col, dir) {
  const len = word.length;
  if (dir === "across") {
    if (col < 0 || col + len > GRID_SIZE || row < 0 || row >= GRID_SIZE) return false;
    if (col - 1 >= 0 && grid[row][col - 1] !== null) return false;
    if (col + len < GRID_SIZE && grid[row][col + len] !== null) return false;
    for (let i = 0; i < len; i++) {
      const c = col + i;
      const existing = grid[row][c];
      if (existing !== null && existing !== word[i]) return false;
      if (existing === null) {
        if (row - 1 >= 0 && grid[row - 1][c] !== null) return false;
        if (row + 1 < GRID_SIZE && grid[row + 1][c] !== null) return false;
      }
    }
    return true;
  } else {
    if (row < 0 || row + len > GRID_SIZE || col < 0 || col >= GRID_SIZE) return false;
    if (row - 1 >= 0 && grid[row - 1][col] !== null) return false;
    if (row + len < GRID_SIZE && grid[row + len][col] !== null) return false;
    for (let i = 0; i < len; i++) {
      const r = row + i;
      const existing = grid[r][col];
      if (existing !== null && existing !== word[i]) return false;
      if (existing === null) {
        if (col - 1 >= 0 && grid[r][col - 1] !== null) return false;
        if (col + 1 < GRID_SIZE && grid[r][col + 1] !== null) return false;
      }
    }
    return true;
  }
}

function place(grid, word, row, col, dir) {
  for (let i = 0; i < word.length; i++) {
    if (dir === "across") grid[row][col + i] = word[i];
    else grid[row + i][col] = word[i];
  }
}

function findIntersectionPlacements(grid, word) {
  const candidates = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const existing = grid[r][c];
      if (existing === null) continue;
      for (let i = 0; i < word.length; i++) {
        if (word[i] !== existing) continue;
        candidates.push({ row: r, col: c - i, dir: "across" });
        candidates.push({ row: r - i, col: c, dir: "down" });
      }
    }
  }
  return candidates;
}

function generateCrossword(entries, targetCount) {
  const sorted = entries.slice().sort((a, b) => b.answer.length - a.answer.length);
  const grid = makeEmptyGrid();
  const placed = [];

  const first = sorted[0];
  const startRow = Math.floor(GRID_SIZE / 2);
  const startCol = Math.floor((GRID_SIZE - first.answer.length) / 2);
  place(grid, first.answer, startRow, startCol, "across");
  placed.push({ ...first, row: startRow, col: startCol, dir: "across" });

  for (let i = 1; i < sorted.length && placed.length < targetCount; i++) {
    const entry = sorted[i];
    const candidates = findIntersectionPlacements(grid, entry.answer);
    let bestPlacement = null;
    for (const cand of candidates) {
      if (canPlace(grid, entry.answer, cand.row, cand.col, cand.dir)) {
        bestPlacement = cand;
        break;
      }
    }
    if (bestPlacement) {
      place(grid, entry.answer, bestPlacement.row, bestPlacement.col, bestPlacement.dir);
      placed.push({ ...entry, row: bestPlacement.row, col: bestPlacement.col, dir: bestPlacement.dir });
    }
  }

  let minR = GRID_SIZE, maxR = -1, minC = GRID_SIZE, maxC = -1;
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (grid[r][c] !== null) {
        minR = Math.min(minR, r); maxR = Math.max(maxR, r);
        minC = Math.min(minC, c); maxC = Math.max(maxC, c);
      }
    }
  }

  const trimmed = placed.map(p => ({ ...p, row: p.row - minR, col: p.col - minC }));
  return { width: maxC - minC + 1, height: maxR - minR + 1, placed: trimmed };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dedupedPool(cycleList) {
  const seen = new Set();
  const pool = [];
  cycleList.forEach(c => c.words.forEach(w => {
    if (!seen.has(w.term)) { seen.add(w.term); pool.push(w); }
  }));
  return pool;
}

function populateCycleSelect() {
  const sel = document.getElementById("cycle-select");
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = "All Cycles";
  sel.appendChild(allOpt);
  CYCLES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = String(c.num);
    const rangeLabel = c.num === 1 ? "Cycle 1" : "Cycles 1\u2013" + c.num;
    opt.textContent = rangeLabel + " \u2014 through " + c.title;
    sel.appendChild(opt);
  });
  sel.value = "all";
  sel.addEventListener("change", newPuzzle);
}

function getActivePool() {
  const sel = document.getElementById("cycle-select");
  if (sel.value === "all") return dedupedPool(CYCLES);
  const selectedNum = parseInt(sel.value, 10);
  return dedupedPool(CYCLES.filter(c => c.num <= selectedNum));
}

let puzzle = null;
let cellMeta = null; // cellMeta[r][c] = { number, across: entryIdx or null, down: entryIdx or null }
let userGrid = null;
let activeEntryIdx = null;
let activeDir = "across";

function buildPuzzleFromPool() {
  const pool = getActivePool();
  let entries = pool
    .map(w => ({ answer: normalize(w.term), def: w.def, term: w.term, display: w.display }))
    .filter(e => e.answer.length >= 3);
  entries = shuffle(entries);
  const wantCount = Math.min(TARGET_WORDS, entries.length);
  // try a few times to get a good placement count
  let best = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const candidate = generateCrossword(shuffle(entries), wantCount);
    if (!best || candidate.placed.length > best.placed.length) best = candidate;
    if (best.placed.length >= Math.min(10, wantCount)) break;
  }
  return best;
}

function computeCellMeta(p) {
  const meta = [];
  for (let r = 0; r < p.height; r++) {
    meta.push(new Array(p.width).fill(null).map(() => ({ number: null, across: null, down: null, letter: null })));
  }
  p.placed.forEach((entry, idx) => {
    for (let i = 0; i < entry.answer.length; i++) {
      const r = entry.dir === "across" ? entry.row : entry.row + i;
      const c = entry.dir === "across" ? entry.col + i : entry.col;
      meta[r][c].letter = entry.answer[i];
      if (entry.dir === "across") meta[r][c].across = idx;
      else meta[r][c].down = idx;
    }
  });
  // assign numbers: unique starting cells, sorted by row then col
  const starts = [];
  p.placed.forEach(entry => {
    starts.push({ row: entry.row, col: entry.col });
  });
  const uniqueStarts = [];
  const seen = new Set();
  starts.sort((a, b) => a.row - b.row || a.col - b.col);
  starts.forEach(s => {
    const key = s.row + "," + s.col;
    if (!seen.has(key)) { seen.add(key); uniqueStarts.push(s); }
  });
  uniqueStarts.forEach((s, i) => { meta[s.row][s.col].number = i + 1; });
  return meta;
}

function newPuzzle() {
  puzzle = buildPuzzleFromPool();
  cellMeta = computeCellMeta(puzzle);
  userGrid = [];
  for (let r = 0; r < puzzle.height; r++) userGrid.push(new Array(puzzle.width).fill(""));
  activeEntryIdx = puzzle.placed.length ? 0 : null;
  activeDir = puzzle.placed.length ? puzzle.placed[0].dir : "across";
  document.getElementById("result-panel").classList.remove("show");
  document.getElementById("message").textContent = "";
  renderGrid();
  renderClues();
}

function renderGrid() {
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";
  gridEl.style.gridTemplateColumns = `repeat(${puzzle.width}, 28px)`;
  gridEl.style.gridTemplateRows = `repeat(${puzzle.height}, 28px)`;

  for (let r = 0; r < puzzle.height; r++) {
    for (let c = 0; c < puzzle.width; c++) {
      const meta = cellMeta[r][c];
      const cellDiv = document.createElement("div");
      if (!meta.letter) {
        cellDiv.className = "cell block";
        gridEl.appendChild(cellDiv);
        continue;
      }
      cellDiv.className = "cell";
      cellDiv.dataset.row = r;
      cellDiv.dataset.col = c;
      if (meta.number) {
        const num = document.createElement("div");
        num.className = "num";
        num.textContent = meta.number;
        cellDiv.appendChild(num);
      }
      const input = document.createElement("input");
      input.maxLength = 1;
      input.value = userGrid[r][c] || "";
      input.addEventListener("focus", () => onCellFocus(r, c));
      input.addEventListener("input", (e) => onCellInput(r, c, e));
      input.addEventListener("keydown", (e) => onCellKeydown(r, c, e));
      cellDiv.appendChild(input);
      gridEl.appendChild(cellDiv);
    }
  }
  highlightActiveEntry();
}

function onCellFocus(r, c) {
  const meta = cellMeta[r][c];
  if (activeEntryIdx !== null) {
    const cur = puzzle.placed[activeEntryIdx];
    const stillOnCurrent = cur.dir === "across"
      ? (r === cur.row && c >= cur.col && c < cur.col + cur.answer.length)
      : (c === cur.col && r >= cur.row && r < cur.row + cur.answer.length);
    if (stillOnCurrent) { highlightActiveEntry(); return; }
  }
  if (meta.across !== null) { activeEntryIdx = meta.across; activeDir = "across"; }
  else if (meta.down !== null) { activeEntryIdx = meta.down; activeDir = "down"; }
  highlightActiveEntry();
}

function onCellInput(r, c, e) {
  const val = e.target.value.replace(/[^a-zA-Z]/g, "").toLowerCase().slice(-1);
  e.target.value = val;
  userGrid[r][c] = val;
  if (val) moveToNext(r, c);
}

function onCellKeydown(r, c, e) {
  if (e.key === "Backspace" && !userGrid[r][c]) {
    moveToPrev(r, c);
  } else if (e.key === "ArrowRight") { focusCell(r, c + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { focusCell(r, c - 1); e.preventDefault(); }
  else if (e.key === "ArrowDown") { focusCell(r + 1, c); e.preventDefault(); }
  else if (e.key === "ArrowUp") { focusCell(r - 1, c); e.preventDefault(); }
  else if (e.key === " ") {
    e.preventDefault();
    const meta = cellMeta[r][c];
    if (meta.across !== null && meta.down !== null) {
      activeDir = activeDir === "across" ? "down" : "across";
      activeEntryIdx = activeDir === "across" ? meta.across : meta.down;
      highlightActiveEntry();
    }
  }
}

function focusCell(r, c) {
  if (r < 0 || c < 0 || r >= puzzle.height || c >= puzzle.width) return;
  if (!cellMeta[r][c].letter) return;
  const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] input`);
  if (el) el.focus();
}

function moveToNext(r, c) {
  if (activeDir === "across") focusCell(r, c + 1);
  else focusCell(r + 1, c);
}
function moveToPrev(r, c) {
  if (activeDir === "across") focusCell(r, c - 1);
  else focusCell(r - 1, c);
}

function highlightActiveEntry() {
  document.querySelectorAll(".cell").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".clue-item").forEach(el => el.classList.remove("active"));
  if (activeEntryIdx === null) return;
  const entry = puzzle.placed[activeEntryIdx];
  for (let i = 0; i < entry.answer.length; i++) {
    const r = entry.dir === "across" ? entry.row : entry.row + i;
    const c = entry.dir === "across" ? entry.col + i : entry.col;
    const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
    if (el) el.classList.add("active");
  }
  const clueEl = document.getElementById("clue-" + activeDir + "-" + activeEntryIdx);
  if (clueEl) clueEl.classList.add("active");
}

function renderClues() {
  const across = document.getElementById("across-list");
  const down = document.getElementById("down-list");
  across.innerHTML = "";
  down.innerHTML = "";
  puzzle.placed.forEach((entry, idx) => {
    const num = cellMeta[entry.row][entry.col].number;
    const wc = wordCountOf(entry.term);
    const wcNote = wc > 1 ? ` (${wc} words)` : "";
    const div = document.createElement("div");
    div.className = "clue-item";
    div.id = "clue-" + entry.dir + "-" + idx;
    div.innerHTML = `<b>${num}.</b> ${entry.def}${wcNote}`;
    div.addEventListener("click", () => {
      activeEntryIdx = idx;
      activeDir = entry.dir;
      focusCell(entry.row, entry.col);
      highlightActiveEntry();
    });
    (entry.dir === "across" ? across : down).appendChild(div);
  });
}

function checkAnswers() {
  let allCorrect = true;
  let anyFilled = false;
  for (let r = 0; r < puzzle.height; r++) {
    for (let c = 0; c < puzzle.width; c++) {
      const meta = cellMeta[r][c];
      if (!meta.letter) continue;
      const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      el.classList.remove("correct", "incorrect");
      if (!userGrid[r][c]) { allCorrect = false; continue; }
      anyFilled = true;
      if (userGrid[r][c] === meta.letter) el.classList.add("correct");
      else { el.classList.add("incorrect"); allCorrect = false; }
    }
  }
  const msg = document.getElementById("message");
  if (!anyFilled) msg.textContent = "Fill in some answers first!";
  else if (allCorrect) msg.textContent = "All correct! Nice work.";
  else msg.textContent = "Some letters aren't right yet \u2014 keep going.";
}

function revealPuzzle() {
  for (let r = 0; r < puzzle.height; r++) {
    for (let c = 0; c < puzzle.width; c++) {
      const meta = cellMeta[r][c];
      if (!meta.letter) continue;
      userGrid[r][c] = meta.letter;
      const el = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] input`);
      if (el) el.value = meta.letter;
    }
  }
  const panel = document.getElementById("result-panel");
  const list = document.getElementById("reveal-list");
  list.innerHTML = "";
  puzzle.placed.forEach((entry, idx) => {
    const num = cellMeta[entry.row][entry.col].number;
    const div = document.createElement("div");
    div.className = "reveal-item";
    div.innerHTML = `<b>${num} ${entry.dir === "across" ? "Across" : "Down"}:</b> ${displayOf(entry)} \u2014 ${entry.def}`;
    list.appendChild(div);
  });
  panel.classList.add("show");
  document.getElementById("message").textContent = "";
}

document.getElementById("new-puzzle-btn").addEventListener("click", newPuzzle);
document.getElementById("check-btn").addEventListener("click", checkAnswers);
document.getElementById("reveal-btn").addEventListener("click", revealPuzzle);

populateCycleSelect();
const urlParams = new URLSearchParams(window.location.search);
const cycleParam = urlParams.get("cycle");
if (cycleParam && (cycleParam === "all" || CYCLES.some(c => String(c.num) === cycleParam))) {
  document.getElementById("cycle-select").value = cycleParam;
}
newPuzzle();
</script>
</body>
